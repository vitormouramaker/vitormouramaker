<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Vitor Moura, Desenvolvedor Front-end · Full Stack">
  <title>Vitor Moura, Desenvolvedor Front-end · Full Stack</title>
  <style>
    .in { opacity: 0; animation: in 0.7s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .rule { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.2s ease-out 0.2s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .in, .rule { animation: none; opacity: 1; stroke-dashoffset: 0; } }
    .name { font: 700 50px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #f0f6fc; letter-spacing: -1px; }
    .role { font: 500 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #f0f6fc; }
    .pitch { font: 400 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #9198a1; }
    .hv { font: 700 24px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #f0f6fc; }
    .hl { font: 400 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #9198a1; }
    .mono { font: 600 30px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #f0f6fc; letter-spacing: 1px; }
  </style>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="12" fill="#0d1117" stroke="#3d444d"/>
  <g class="in"><text x="56" y="92" class="name">Vitor Moura</text></g>
  <g class="in" style="animation-delay:0.1s"><text x="56" y="128" class="role">Desenvolvedor Front-end · Full Stack</text></g>
  <g class="in" style="animation-delay:0.2s"><text x="56" y="160" class="pitch">Interfaces de produto com React e TypeScript, da tela ao banco de dados.</text></g>
  <line x1="56" y1="188" x2="1144" y2="188" stroke="#3d444d" class="rule"/>
  <g class="in">
    <rect x="1064" y="48" width="80" height="80" rx="10" fill="#151b23" stroke="#3d444d"/>
    <text x="1104" y="99" class="mono" text-anchor="middle">VM</text>
  </g>
  <g class="in" style="animation-delay:0.35s">
      
      <text x="56" y="236" class="hv">11 sistemas</text>
      <text x="56" y="260" class="hl">completos, com código público</text>
    </g>
    <g class="in" style="animation-delay:0.44999999999999996s">
      <line x1="394.6666666666667" y1="214" x2="394.6666666666667" y2="262" stroke="#3d444d"/>
      <text x="418.6666666666667" y="236" class="hv">Web · Mobile · Desktop</text>
      <text x="418.6666666666667" y="260" class="hl">React, React Native e Tauri</text>
    </g>
    <g class="in" style="animation-delay:0.55s">
      <line x1="757.3333333333334" y1="214" x2="757.3333333333334" y2="262" stroke="#3d444d"/>
      <text x="781.3333333333334" y="236" class="hv">IA aplicada</text>
      <text x="781.3333333333334" y="260" class="hl">agentes, RAG e saída estruturada</text>
    </g>
</svg>
