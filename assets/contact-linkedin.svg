<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 96" width="440" height="96" role="img" aria-label="LinkedIn: in/vitor-moura-dev">
  <title>LinkedIn: in/vitor-moura-dev</title>
  <defs>
    <linearGradient id="bg0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1022"/><stop offset="1" stop-color="#141a3a"/></linearGradient>
    <linearGradient id="edge0" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a66c2"/><stop offset="0.5" stop-color="#0a66c2" stop-opacity="0.05"/><stop offset="1" stop-color="#a78bfa"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="shine0" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="clip0"><rect width="440" height="96" rx="20"/></clipPath>
  </defs>
  <style>
    .ring { animation: ring 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes ring { from { transform: scale(1); opacity: 0.7; } to { transform: scale(1.7); opacity: 0; } }
    .shine { animation: shine 4.5s ease-in-out 0s infinite; }
    @keyframes shine { 0% { transform: translateX(-200px); } 60%, 100% { transform: translateX(540px); } }
    .ico { font: 800 22px 'Segoe UI', 'Inter', 'Helvetica Neue', Ubuntu, Arial, sans-serif; fill: #fff; }
    .lbl { font: 700 13px 'Segoe UI', 'Inter', 'Helvetica Neue', Ubuntu, Arial, sans-serif; fill: #60a5fa; letter-spacing: 2px; }
    .val { font: 600 18px 'Segoe UI', 'Inter', 'Helvetica Neue', Ubuntu, Arial, sans-serif; fill: #f1f5f9; }
    .go { font: 700 20px 'Segoe UI', 'Inter', 'Helvetica Neue', Ubuntu, Arial, sans-serif; fill: #94a3b8; animation: nudge 1.8s ease-in-out infinite; }
    @keyframes nudge { 50% { transform: translateX(5px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .shine { display: none; } }
  </style>
  <g clip-path="url(#clip0)">
    <rect width="440" height="96" fill="url(#bg0)"/>
    <rect width="140" height="96" fill="url(#shine0)" class="shine"/>
  </g>
  <rect x="1" y="1" width="438" height="94" rx="19" fill="none" stroke="url(#edge0)" stroke-width="2"/>
  <circle cx="54" cy="48" r="24" fill="none" stroke="#0a66c2" stroke-width="2" class="ring"/>
  <circle cx="54" cy="48" r="24" fill="#0a66c2"/>
  <text x="54" y="56" class="ico" text-anchor="middle">in</text>
  <text x="96" y="40" class="lbl">LINKEDIN</text>
  <text x="96" y="66" class="val">in/vitor-moura-dev</text>
  <text x="410" y="55" class="go" text-anchor="end">→</text>
</svg>
