  <g class="in d1"><text x="32" y="86" class="title">Orça Eventos</text></g>
  <g class="in d2"><text x="32" y="124" class="desc">Orçamentos de formatura com motor de cálculo, aprovação de</text><text x="32" y="148" class="desc">descontos, versões, contratos e auditoria. 181 testes no</text><text x="32" y="172" class="desc">front.</text></g>
  <g class="in d3"><g><rect x="32" y="226" width="82.8" height="28" rx="14" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-opacity="0.5"/><text x="73.4" y="245" class="chip" text-anchor="middle">React 19</text></g><g><rect x="122.8" y="226" width="98" height="28" rx="14" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-opacity="0.5"/><text x="171.8" y="245" class="chip" text-anchor="middle">TypeScript</text></g><g><rect x="228.8" y="226" width="82.8" height="28" rx="14" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-opacity="0.5"/><text x="270.2" y="245" class="chip" text-anchor="middle">TanStack</text></g><g><rect x="319.6" y="226" width="75.19999999999999" height="28" rx="14" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-opacity="0.5"/><text x="357.20000000000005" y="245" class="chip" text-anchor="middle">Zustand</text></g><g><rect x="402.8" y="226" width="67.6" height="28" rx="14" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-opacity="0.5"/><text x="436.6" y="245" class="chip" text-anchor="middle">Vitest</text></g></g>
