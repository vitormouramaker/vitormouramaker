<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="Círculo: Comunidade de empresários com app e web: chat em tempo real, eventos com check-in por QR, aulas em vídeo, gamificação e painel admin.">
  <title>Círculo: Comunidade de empresários com app e web: chat em tempo real, eventos com check-in por QR, aulas em vídeo, gamificação e painel admin.</title>
  <defs>
    <linearGradient id="c1bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1022"/><stop offset="1" stop-color="#121633"/></linearGradient>
    <linearGradient id="c1b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eab308"/><stop offset="0.45" stop-color="#eab308" stop-opacity="0.05"/><stop offset="0.55" stop-color="#a78bfa" stop-opacity="0.05"/><stop offset="1" stop-color="#a78bfa"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="c1glow" cx="0.85" cy="0.1" r="0.6"><stop offset="0" stop-color="#eab308" stop-opacity="0.35"/><stop offset="1" stop-color="#eab308" stop-opacity="0"/></radialGradient>
    <clipPath id="c1clip"><rect width="600" height="300" rx="20"/></clipPath>
  </defs>
  <style>
    .in { opacity: 0; animation: in 0.8s ease-out forwards; }
    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.25s; } .d3 { animation-delay: 0.4s; }
    @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .glow { animation: breathe 5s ease-in-out infinite; }
    @keyframes breathe { 50% { opacity: 0.45; } }
    .kicker { font: 700 12px 'Segoe UI', 'Inter', 'Helvetica Neue', Ubuntu, Arial, sans-serif; fill: #eab308; letter-spacing: 2px; }
    .title { font: 800 30px 'Segoe UI', 'Inter', 'Helvetica Neue', Ubuntu, Arial, sans-serif; fill: #f8fafc; letter-spacing: -0.5px; }
    .desc { font: 400 16px 'Segoe UI', 'Inter', 'Helvetica Neue', Ubuntu, Arial, sans-serif; fill: #cbd5e1; }
    .chip { font: 600 12.5px 'Segoe UI', 'Inter', 'Helvetica Neue', Ubuntu, Arial, sans-serif; fill: #e2e8f0; }
    .repo { font: 500 13px 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; fill: #94a3b8; }
    .arrow { animation: nudge 1.8s ease-in-out infinite; }
    @keyframes nudge { 50% { transform: translateX(5px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
  </style>
  <g clip-path="url(#c1clip)">
    <rect width="600" height="300" fill="url(#c1bg)"/>
    <rect width="600" height="300" fill="url(#c1glow)" class="glow"/>
  </g>
  <rect x="1" y="1" width="598" height="298" rx="19" fill="none" stroke="url(#c1b)" stroke-width="2"/>
  <g class="in"><text x="32" y="46" class="kicker">WEB + MOBILE · TEMPO REAL</text></g>
  <g class="in d1"><text x="32" y="86" class="title">Círculo</text></g>
  <g class="in d2"><text x="32" y="124" class="desc">Comunidade de empresários com app e web: chat em tempo real,</text><text x="32" y="148" class="desc">eventos com check-in por QR, aulas em vídeo, gamificação e</text><text x="32" y="172" class="desc">painel admin.</text></g>
  <g class="in d3"><g><rect x="32" y="226" width="98" height="28" rx="14" fill="#eab308" fill-opacity="0.14" stroke="#eab308" stroke-opacity="0.5"/><text x="81" y="245" class="chip" text-anchor="middle">Next.js 16</text></g><g><rect x="138" y="226" width="113.19999999999999" height="28" rx="14" fill="#eab308" fill-opacity="0.14" stroke="#eab308" stroke-opacity="0.5"/><text x="194.6" y="245" class="chip" text-anchor="middle">React Native</text></g><g><rect x="259.2" y="226" width="90.39999999999999" height="28" rx="14" fill="#eab308" fill-opacity="0.14" stroke="#eab308" stroke-opacity="0.5"/><text x="304.4" y="245" class="chip" text-anchor="middle">Socket.IO</text></g><g><rect x="357.59999999999997" y="226" width="98" height="28" rx="14" fill="#eab308" fill-opacity="0.14" stroke="#eab308" stroke-opacity="0.5"/><text x="406.59999999999997" y="245" class="chip" text-anchor="middle">TypeScript</text></g></g>
