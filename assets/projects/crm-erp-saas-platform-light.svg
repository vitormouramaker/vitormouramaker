<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" width="600" height="230" role="img" aria-label="Órbita CRM: CRM e ERP multiempresa com atendimento pelo WhatsApp, funil de vendas, PDV, estoque e financeiro. Projeto desenvolvido em equipe.">
  <title>Órbita CRM: CRM e ERP multiempresa com atendimento pelo WhatsApp, funil de vendas, PDV, estoque e financeiro. Projeto desenvolvido em equipe.</title>
  <style>
    .in { opacity: 0; animation: in 0.7s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .rule { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.2s ease-out 0.2s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .in, .rule { animation: none; opacity: 1; stroke-dashoffset: 0; } }
    .cat { font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #59636e; letter-spacing: 1.2px; }
    .title { font: 700 26px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #1f2328; }
    .desc { font: 400 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #1f2328; }
    .stack { font: 400 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #59636e; }
    .repo { font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #59636e; }
  </style>
  <rect x="0.5" y="0.5" width="599" height="229" rx="12" fill="#ffffff" stroke="#d1d9e0"/>
  <g class="in">
    <text x="28" y="42" class="cat">SAAS · PROJETO DE EQUIPE</text>
    <text x="28" y="80" class="title">Órbita CRM</text>
    <text x="28" y="114" class="desc">CRM e ERP multiempresa com atendimento pelo WhatsApp, funil de</text>
    <text x="28" y="137" class="desc">vendas, PDV, estoque e financeiro. Projeto desenvolvido em equipe.</text>
  </g>
  <line x1="28" y1="182" x2="572" y2="182" stroke="#d1d9e0"/>
  <g class="in" style="animation-delay:0.15s">
    <text x="28" y="208" class="stack">React 19  ·  React Native  ·  Express  ·  PostgreSQL</text>
    <text x="572" y="42" class="repo" text-anchor="end">crm-erp-saas-platform</text>
  </g>
</svg>
