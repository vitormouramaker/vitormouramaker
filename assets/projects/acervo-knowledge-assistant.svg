    <clipPath id="c7clip"><rect width="600" height="300" rx="20"/></clipPath>
  </defs>
  <style>
    .in { opacity: 0; animation: in 0.8s ease-out forwards; }
    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.25s; } .d3 { animation-delay: 0.4s; }
    @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .glow { animation: breathe 5s ease-in-out infinite; }
    @keyframes breathe { 50% { opacity: 0.45; } }
    .kicker { font: 700 12px 'Segoe UI', 'Inter', 'Helvetica Neue', Ubuntu, Arial, sans-serif; fill: #a78bfa; letter-spacing: 2px; }
    .title { font: 800 30px 'Segoe UI', 'Inter', 'Helvetica Neue', Ubuntu, Arial, sans-serif; fill: #f8fafc; letter-spacing: -0.5px; }
    .desc { font: 400 16px 'Segoe UI', 'Inter', 'Helvetica Neue', Ubuntu, Arial, sans-serif; fill: #cbd5e1; }
    .chip { font: 600 12.5px 'Segoe UI', 'Inter', 'Helvetica Neue', Ubuntu, Arial, sans-serif; fill: #e2e8f0; }
    .repo { font: 500 13px 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; fill: #94a3b8; }
    .arrow { animation: nudge 1.8s ease-in-out infinite; }
    @keyframes nudge { 50% { transform: translateX(5px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
  </style>
