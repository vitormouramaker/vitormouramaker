<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="Acervo: Assistente que responde com base nos documentos da empresa, com citações validadas, multiempresa com RLS e busca vetorial.">
  <title>Acervo: Assistente que responde com base nos documentos da empresa, com citações validadas, multiempresa com RLS e busca vetorial.</title>
  <defs>
