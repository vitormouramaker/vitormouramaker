<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" width="600" height="230" role="img" aria-label="ProConecta: Marketplace de serviços com carteira de créditos, vagas, chat, plano Premium e pagamentos, sobre regras de segurança do Firestore.">
  <title>ProConecta: Marketplace de serviços com carteira de créditos, vagas, chat, plano Premium e pagamentos, sobre regras de segurança do Firestore.</title>
  <style>
    .in { opacity: 0; animation: in 0.7s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .rule { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.2s ease-out 0.2s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .in, .rule { animation: none; opacity: 1; stroke-dashoffset: 0; } }
    .cat { font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #9198a1; letter-spacing: 1.2px; }
    .title { font: 700 26px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #f0f6fc; }
    .desc { font: 400 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #f0f6fc; }
    .stack { font: 400 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #9198a1; }
    .repo { font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #9198a1; }
  </style>
  <rect x="0.5" y="0.5" width="599" height="229" rx="12" fill="#0d1117" stroke="#3d444d"/>
  <g class="in">
    <text x="28" y="42" class="cat">MOBILE · MARKETPLACE</text>
    <text x="28" y="80" class="title">ProConecta</text>
    <text x="28" y="114" class="desc">Marketplace de serviços com carteira de créditos, vagas, chat,</text>
    <text x="28" y="137" class="desc">plano Premium e pagamentos, sobre regras de segurança do</text>
    <text x="28" y="160" class="desc">Firestore.</text>
  </g>
  <line x1="28" y1="182" x2="572" y2="182" stroke="#3d444d"/>
  <g class="in" style="animation-delay:0.15s">
    <text x="28" y="208" class="stack">React Native  ·  Expo  ·  Firebase  ·  TypeScript</text>
    <text x="572" y="42" class="repo" text-anchor="end">marketplace-servicos-expo-firebase</text>
  </g>
</svg>
