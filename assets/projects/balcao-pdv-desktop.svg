<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="Balcão PDV: Ponto de venda desktop pensado para teclado e leitor de código de barras, com pagamento dividido na maquininha e caixa.">
  <title>Balcão PDV: Ponto de venda desktop pensado para teclado e leitor de código de barras, com pagamento dividido na maquininha e caixa.</title>
  <defs>
    <linearGradient id="c8bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1022"/><stop offset="1" stop-color="#121633"/></linearGradient>
    <linearGradient id="c8b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24c8db"/><stop offset="0.45" stop-color="#24c8db" stop-opacity="0.05"/><stop offset="0.55" stop-color="#a78bfa" stop-opacity="0.05"/><stop offset="1" stop-color="#a78bfa"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="c8glow" cx="0.85" cy="0.1" r="0.6"><stop offset="0" stop-color="#24c8db" stop-opacity="0.35"/><stop offset="1" stop-color="#24c8db" stop-opacity="0"/></radialGradient>
    <clipPath id="c8clip"><rect width="600" height="300" rx="20"/></clipPath>
  </defs>
  <style>
    .in { opacity: 0; animation: in 0.8s ease-out forwards; }
    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.25s; } .d3 { animation-delay: 0.4s; }
    @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .glow { animation: breathe 5s ease-in-out infinite; }
    @keyframes breathe { 50% { opacity: 0.45; } }
    .kicker { font: 700 12px 'Segoe UI', 'Inter', 'Helvetica Neue', Ubuntu, Arial, sans-serif; fill: #24c8db; letter-spacing: 2px; }
    .title { font: 800 30px 'Segoe UI', 'Inter', 'Helvetica Neue', Ubuntu, Arial, sans-serif; fill: #f8fafc; letter-spacing: -0.5px; }
    .desc { font: 400 16px 'Segoe UI', 'Inter', 'Helvetica Neue', Ubuntu, Arial, sans-serif; fill: #cbd5e1; }
    .chip { font: 600 12.5px 'Segoe UI', 'Inter', 'Helvetica Neue', Ubuntu, Arial, sans-serif; fill: #e2e8f0; }
    .repo { font: 500 13px 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; fill: #94a3b8; }
    .arrow { animation: nudge 1.8s ease-in-out infinite; }
    @keyframes nudge { 50% { transform: translateX(5px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
  </style>
  <g clip-path="url(#c8clip)">
    <rect width="600" height="300" fill="url(#c8bg)"/>
    <rect width="600" height="300" fill="url(#c8glow)" class="glow"/>
  </g>
  <rect x="1" y="1" width="598" height="298" rx="19" fill="none" stroke="url(#c8b)" stroke-width="2"/>
  <g class="in"><text x="32" y="46" class="kicker">DESKTOP · VAREJO</text></g>
  <g class="in d1"><text x="32" y="86" class="title">Balcão PDV</text></g>
  <g class="in d2"><text x="32" y="124" class="desc">Ponto de venda desktop pensado para teclado e leitor de código</text><text x="32" y="148" class="desc">de barras, com pagamento dividido na maquininha e caixa.</text></g>
  <g class="in d3"><g><rect x="32" y="226" width="75.19999999999999" height="28" rx="14" fill="#24c8db" fill-opacity="0.14" stroke="#24c8db" stroke-opacity="0.5"/><text x="69.6" y="245" class="chip" text-anchor="middle">Tauri 2</text></g><g><rect x="115.19999999999999" y="226" width="52.4" height="28" rx="14" fill="#24c8db" fill-opacity="0.14" stroke="#24c8db" stroke-opacity="0.5"/><text x="141.39999999999998" y="245" class="chip" text-anchor="middle">Rust</text></g><g><rect x="175.6" y="226" width="60" height="28" rx="14" fill="#24c8db" fill-opacity="0.14" stroke="#24c8db" stroke-opacity="0.5"/><text x="205.6" y="245" class="chip" text-anchor="middle">React</text></g><g><rect x="243.6" y="226" width="98" height="28" rx="14" fill="#24c8db" fill-opacity="0.14" stroke="#24c8db" stroke-opacity="0.5"/><text x="292.6" y="245" class="chip" text-anchor="middle">TypeScript</text></g></g>
  <text x="568" y="46" class="repo" text-anchor="end">balcao-pdv-desktop <tspan class="arrow">→</tspan></text>
