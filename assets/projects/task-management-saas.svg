<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="Pauta: Gestão de tarefas multiempresa com kanban, lista, tabela, timeline e calendário, automações, assinaturas e tempo real.">
  <title>Pauta: Gestão de tarefas multiempresa com kanban, lista, tabela, timeline e calendário, automações, assinaturas e tempo real.</title>
  <defs>
    <linearGradient id="c2bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1022"/><stop offset="1" stop-color="#121633"/></linearGradient>
    <linearGradient id="c2b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06b6d4"/><stop offset="0.45" stop-color="#06b6d4" stop-opacity="0.05"/><stop offset="0.55" stop-color="#a78bfa" stop-opacity="0.05"/><stop offset="1" stop-color="#a78bfa"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="c2glow" cx="0.85" cy="0.1" r="0.6"><stop offset="0" stop-color="#06b6d4" stop-opacity="0.35"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
    <clipPath id="c2clip"><rect width="600" height="300" rx="20"/></clipPath>
  </defs>
  <style>
    .in { opacity: 0; animation: in 0.8s ease-out forwards; }
    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.25s; } .d3 { animation-delay: 0.4s; }
    @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .glow { animation: breathe 5s ease-in-out infinite; }
    @keyframes breathe { 50% { opacity: 0.45; } }
    .kicker { font: 700 12px 'Segoe UI', 'Inter', 'Helvetica Neue', Ubuntu, Arial, sans-serif; fill: #06b6d4; letter-spacing: 2px; }
    .title { font: 800 30px 'Segoe UI', 'Inter', 'Helvetica Neue', Ubuntu, Arial, sans-serif; fill: #f8fafc; letter-spacing: -0.5px; }
    .desc { font: 400 16px 'Segoe UI', 'Inter', 'Helvetica Neue', Ubuntu, Arial, sans-serif; fill: #cbd5e1; }
    .chip { font: 600 12.5px 'Segoe UI', 'Inter', 'Helvetica Neue', Ubuntu, Arial, sans-serif; fill: #e2e8f0; }
    .repo { font: 500 13px 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; fill: #94a3b8; }
    .arrow { animation: nudge 1.8s ease-in-out infinite; }
    @keyframes nudge { 50% { transform: translateX(5px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
  </style>
  <g clip-path="url(#c2clip)">
    <rect width="600" height="300" fill="url(#c2bg)"/>
    <rect width="600" height="300" fill="url(#c2glow)" class="glow"/>
  </g>
  <rect x="1" y="1" width="598" height="298" rx="19" fill="none" stroke="url(#c2b)" stroke-width="2"/>
